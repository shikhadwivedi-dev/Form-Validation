<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create your account</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>Create your account</h1>
    <p class="subtitle">Join us to save your favourite stories.</p>

    <form id="signup" novalidate>
      <div class="field">
        <label for="name">Full name</label>
        <input type="text" id="name" name="name" required autocomplete="name" aria-describedby="name-error" placeholder="e.g. Shikha Dwivedi">
        <p class="error" id="name-error" aria-live="polite"></p>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email" aria-describedby="email-error" placeholder="name@example.com">
        <p class="error" id="email-error" aria-live="polite"></p>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="new-password" aria-describedby="password-error password-hint" placeholder="At least 10 characters + a number">
        <p class="hint" id="password-hint">Use at least 10 characters including a number.</p>
        <div class="meter" aria-hidden="true"><div id="meter-bar"></div></div>
        <p class="strength" id="strength-text" aria-live="polite"></p>
        <p class="error" id="password-error" aria-live="polite"></p>
      </div>

      <div class="field">
        <label for="confirm">Confirm password</label>
        <input type="password" id="confirm" name="confirm" required autocomplete="new-password" aria-describedby="confirm-error" placeholder="Type password again">
        <p class="error" id="confirm-error" aria-live="polite"></p>
      </div>

      <button type="submit">Create account</button>
      <p class="success" id="success-msg" aria-live="polite"></p>
    </form>
  </main>
  <script src="script.js"></script>
</body>
</html>
